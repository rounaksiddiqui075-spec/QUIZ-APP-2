<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4 text-center">
                <div class="card border-0 shadow p-5">
                    <h2 class="fw-bold text-dark mb-3">Quiz Completed</h2>
                    <p class="text-muted mb-4">Thank you for taking the quiz. Here is your performance summary:</p>

                    <div class="bg-light rounded p-4 mb-4">
                        <span class="text-secondary d-block uppercase small fw-semibold mb-1">Your Score</span>
                        <h1 class="display-4 fw-bold text-primary mb-0">{{ score }} / {{ total }}</h1>
                    </div>

                    <a href="/" class="btn btn-outline-primary w-100 py-2 fw-semibold">Retake Quiz</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
