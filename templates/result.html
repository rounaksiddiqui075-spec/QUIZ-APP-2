<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .result-card {
            background: rgba(0, 0, 0, 0.45) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 16px;
        }

        .score-box {
            background-color: rgba(255, 255, 255, 0.15) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            border-radius: 12px;
        }
    </style>
</head>

<body class="d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 text-center">
                <div class="card result-card border-0 shadow-lg p-5">
                    <h2 class="fw-bold text-white mb-3">Quiz Completed</h2>
                    <p class="text-light opacity-75 mb-4">Thank you for taking the quiz. Here is your performance
                        summary:</p>

                    <div class="score-box p-4 mb-4">
                        <span class="text-light opacity-75 d-block uppercase small fw-semibold mb-1">Your Score</span>
                        <h1 class="display-3 fw-bold text-white mb-0">{{ score }} / {{ total }}</h1>
                    </div>

                    <a href="/" class="btn btn-primary w-100 py-3 fw-semibold text-uppercase tracking-wide">Retake
                        Quiz</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
