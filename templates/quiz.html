<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Assessment Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .quiz-card {
            background: rgba(0, 0, 0, 0.45) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 16px;
        }

        .question-title {
            color: #ffffff !important;
            font-weight: 600;
        }

        .option-box {
            background-color: rgba(255, 255, 255, 0.15) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #ffffff !important;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border-radius: 8px;
        }

        .option-box:hover {
            background-color: rgba(255, 255, 255, 0.3) !important;
            border-color: #ffffff !important;
            transform: translateY(-1px);
        }

        .form-check-label {
            color: #ffffff !important;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="text-center mb-4 text-white">
                    <h2 class="fw-bold display-6">Python Online Quiz</h2>
                    <p class="text-light opacity-75">Test your core knowledge of Python concepts</p>
                </div>

                <form action="/submit" method="POST" class="card quiz-card shadow-lg p-4 p-md-5">
                    {% for q in questions %}
                    <div class="mb-4">
                        <h5 class="mb-3 question-title">Q{{ loop.index }}. {{ q.question }}</h5>

                        {% for option in q.options %}
                        <div class="form-check p-3 ps-5 border mb-2 option-box">
                            <input class="form-check-input ms-n4" type="radio" name="question-{{ q.id }}"
                                value="{{ option }}" id="q{{ q.id }}-{{ loop.index }}" required>
                            <label class="form-check-label w-100" for="q{{ q.id }}-{{ loop.index }}">
                                {{ option }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                    {% if not loop.last %}
                    <hr class="text-light opacity-25 my-4">
                    {% endif %}
                    {% endfor %}

                    <button type="submit"
                        class="btn btn-primary w-100 py-3 mt-3 fw-semibold text-uppercase tracking-wide">Submit
                        Answers</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
