<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Assessment Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Python Online Quiz</h2>
                    <p class="text-muted">Test your core knowledge of Python concepts</p>
                </div>

                <form action="/submit" method="POST" class="card border-0 shadow-sm p-4">
                    {% for q in questions %}
                    <div class="mb-4">
                        <h5 class="mb-3 text-secondary">Q{{ loop.index }}. {{ q.question }}</h5>

                        {% for option in q.options %}
                        <div class="form-check p-2 ps-4 border rounded mb-2 bg-white">
                            <input class="form-check-input" type="radio" name="question-{{ q.id }}" value="{{ option }}"
                                id="q{{ q.id }}-{{ loop.index }}" required>
                            <label class="form-check-label w-100 cursor-pointer" for="q{{ q.id }}-{{ loop.index }}">
                                {{ option }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                    {% if not loop.last %}
                    <hr class="text-muted opacity-25 my-4">
                    {% endif %}
                    {% endfor %}

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3 fw-semibold">Submit Answers</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
